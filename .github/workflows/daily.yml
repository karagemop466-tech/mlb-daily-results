name: Collect MLB results

on:
  schedule:
    # 08:10 UTC (~4:10am ET / 1:10am PT) - after all West Coast games are final.
    - cron: "10 8 * * *"
    # 16:10 UTC (~12:10pm ET) - catches late finals and stat corrections.
    - cron: "10 16 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Number of past days to re-collect (default 2)"
        required: false
        default: "2"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mlb-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect results
        run: |
          DAYS="${{ github.event.inputs.backfill_days }}"
          if [ -n "$DAYS" ]; then
            python scripts/collect.py --backfill "$DAYS"
          else
            python scripts/collect.py
          fi

      - name: Build site
        run: python scripts/build_site.py

      - name: Commit data + site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Daily update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
